<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; }
        body { font-family: "Ubuntu", sans-serif; background: #101214; color: #fff; margin: 0; padding: 24px; }
        main { width: min(100%, 760px); margin: auto; }
        h1 { font-size: 26px; font-weight: 500; margin: 0 0 6px; color: #fff; }
        .subtitle { color: #c4c8ca; margin: 0 0 18px; }
        .controls, .result { background: #191c1f; border: 1px solid #34383c; border-radius: 12px; padding: 18px; margin-top: 12px; box-shadow: 0 3px 14px rgba(0, 0, 0, .28); }
        .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        button, select { border: 1px solid #4b585e; border-radius: 7px; padding: 9px 13px; font: inherit; }
        button { background: #607d8b; border-color: #607d8b; color: #fff; cursor: pointer; }
        button:hover { background: #718e9b; }
        select { background: #25292d; color: #fff; }
        label { color: #fff; }
        .checkbox { display: block; margin-top: 14px; color: #fff; }
        #status { min-height: 20px; color: #fff; margin: 14px 0 0; }
        #result h2 { font-size: 18px; font-weight: 400; margin: 0; color: #fff; }
        #preview { display: block; max-width: 100%; max-height: 70vh; margin: 14px auto 0; border-radius: 7px; }
        #details { color: #fff; margin-bottom: 0; }
        .error { color: #ef9a9a !important; }
        .hidden { display: none; }
    </style>
</head>
<body>
<main>
    <h1>DIHH Image Format</h1>
    <p class="subtitle">Prosta konwersja i kompresja obrazów</p>
    <section class="controls">
        <div class="row">
            <label for="format">Konwertuj do:</label>
            <select id="format">
                <option value="dihh">DIHH</option>
                <option value="jpg">JPG</option>
                <option value="png">PNG</option>
            </select>
            <button id="convertButton">Wybierz obraz</button>
        </div>
        <label class="checkbox">
            <input type="checkbox" id="savePreview">
            Zapisz plik podglądu obok wyniku
        </label>
        <p id="status">Wybierz format docelowy i plik wejściowy.</p>
    </section>
    <section id="result" class="result hidden">
        <h2>Podgląd wyniku</h2>
        <img id="preview" alt="Podgląd przekonwertowanego obrazu">
        <p id="details"></p>
    </section>
</main>
<script>
    const format = document.getElementById("format");
    const button = document.getElementById("convertButton");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const preview = document.getElementById("preview");
    const details = document.getElementById("details");

    button.addEventListener("click", () => {
        status.className = "";
        status.textContent = "Wybieranie pliku...";
        const response = JSON.parse(app.chooseAndConvert(
            format.value,
            document.getElementById("savePreview").checked
        ));
        if (response.cancelled) {
            status.textContent = "Anulowano wybór pliku.";
            return;
        }
        if (response.error) {
            status.className = "error";
            status.textContent = response.error;
            return;
        }
        preview.src = response.output;
        result.className = "result";
        details.textContent = `Rozmiar: ${formatBytes(response.originalSize)} → ${formatBytes(response.outputSize)} | ` +
            `Kompresja: ${response.ratio.toFixed(2)}× | Wymiary: ${response.width} × ${response.height}`;
        status.textContent = `Zapisano plik: ${response.output}`;
    });

    function formatBytes(bytes) {
        if (bytes < 1024) return `${bytes} B`;
        if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
        return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }
</script>
</body>
</html>
